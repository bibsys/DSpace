#---------------------------------------------------------------#
#--------------- PUL (Presses universitaires de Louvain) -------#
#---------------------------------------------------------------#
# Import of the PUL book catalogue delivered as ONIX 3.0 files (one <Product> per file, named <GCOI>.xml).
# The `pul-import` script reads local directories filled by an external process (FTP is out of DSpace's scope),
# turns each ONIX file into DIM through the XSLT crosswalk below, then creates or completes the publication.
# Working notes and decisions: PUL_IMPORT.md at the repository root (not versioned).

# ONIX 3.0 -> DIM crosswalk, picked up by org.dspace.content.crosswalk.XSLTIngestionCrosswalk under the name `ONIX`.
# The mapping table is documented in the header of the stylesheet.
crosswalk.submission.ONIX.stylesheet = crosswalks/onix-submission.xsl

# --- Import script (phases 3-6, not implemented yet; keys documented ahead of time) ------------------------------
# Target collection for new publications (handle or UUID); environment specific, override in local.cfg.
#pul.import.collection =
# Recipients of the end-of-run report email.
#pul.import.report.recipients =
# Default license URL set on PDF bitstreams when the ONIX record carries none (see bitstream_licenses value-pairs).
#pul.import.default-license =

# How an existing publication is completed from a new ONIX record (metadata fields, comma separated).
# A field listed nowhere is never touched on update.
#   replace      : the ONIX values replace the existing ones
#   merge        : ONIX values missing from the item are added, existing ones are kept
#   add-if-empty : written only when the item has no value at all for the field
#pul.import.update.replace = dc.description.abstract, dc.title
#pul.import.update.merge = dc.subject, dc.identifier.isbn, dc.identifier.gcoi, dcterms.source
