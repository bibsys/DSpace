#---------------------------------------------------------------#
#--------------- PUL (Presses universitaires de Louvain) -------#
#---------------------------------------------------------------#
# Import of the PUL book catalogue delivered as ONIX 3.0 files (one <Product> per file, named <GCOI>.xml).
# The `pul-import` script reads local directories filled by an external process (FTP is out of DSpace's scope),
# turns each ONIX file into DIM through the XSLT crosswalk below, then creates or completes the publication. The ONIX
# file is kept as an administrative bitstream (METADATA bundle) and its front cover is downloaded from pul.uclouvain.be,
# scaled with DSpace's thumbnail settings and stored in the THUMBNAIL bundle as <GCOI>.pdf.jpg.
# Working notes and decisions: PUL_IMPORT.md at the repository root (not versioned).

# ONIX 3.0 -> DIM crosswalk, picked up by org.dspace.content.crosswalk.XSLTIngestionCrosswalk under the name `ONIX`.
# The mapping table is documented in the header of the stylesheet.
crosswalk.submission.ONIX.stylesheet = crosswalks/onix-submission.xsl

# --- Import script `pul-import` ---------------------------------------------------------------------------------
# Run as an administrator (-e), daily: dspace pul-import -e <admin> [--dir <path>] [--dry-run]
# Directory holding the ONIX files (<GCOI>.xml); --dir overrides it. Processed files are moved to done/ and errors/.
#pul.import.directory = /uclouvain/pul/onix
# Directory holding the PDF files (<GCOI>.pdf or <ISBN>.pdf, stored as <GCOI>.pdf) to attach to already imported
# publications; --pdf-dir overrides it.
# A PDF whose publication is not imported yet stays in place for a later run. Not set = PDFs are not processed.
#pul.import.pdf-directory = /uclouvain/pul/pdf

# Target collection for new publications (handle or UUID); environment specific, override in local.cfg.
# pul.import.collection =
# End-of-run report email (template dspace/config/emails/pul_import_report), sent to the DSpace administrator address
# by default (mail.admin, overridable in local.cfg). Empty = not sent.
pul.import.report.recipients = ${mail.admin}
pul.import.report.subject = [DIAL.pr] PUL import report
# PDF access: `openaccess` when the item carries a `dcterms.license` (from the ONIX EpubLicense), `restricted`
# (UCLouvain network) otherwise — the access conditions of access-conditions.xml, as in the submission form. A PDF of
# the same name already attached is replaced.

# How an existing publication is completed from a new ONIX record (metadata fields, comma separated).
# A field listed nowhere is never touched on update (e.g. dc.type.*: the existing subtype may be more precise).
#   replace      : the ONIX values replace the existing ones (all languages)
#   merge        : ONIX values missing from the item are added, existing ones are kept (identifiers compared in
#                  their normalized form, so an ISBN typed with hyphens is not added again without them)
#   add-if-empty : written only when the item has no value at all for the field
#
# !!! Authors are not governed by these lists: an ONIX contributor whose name is not yet among the item's authors is
# appended (with the CRIS placeholder for email, ORCID, FGS and institution, and its ONIX role); existing authors,
# linked to an authority or not, are never touched. `dc.contributor.etal` is removed once the ONIX lists named
# contributors only (no UnnamedPersons).
pul.import.update.replace = dc.title, dc.description.abstract
pul.import.update.merge = dc.identifier.isbn, dc.identifier.gcoi, dc.subject, dcterms.source, dcterms.license
pul.import.update.add-if-empty = dc.language.iso, dc.date.issued, publication.editor.name, \
    publication.editor.location, publication.collection.name, publication.collection.number, \
    publication.numberOfPages
