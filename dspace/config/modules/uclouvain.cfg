#------------------------------------------------------------------#
#-------------------- DILBERT Configuration -----------------------#
#------------------------------------------------------------------#
uclouvain.main_dial_url = https://dial.uclouvain.be
uclouvain.main_author_query.url = ${uclouvain.main_dial_url}/cgi-bin/valet_utils
uclouvain.authority.name = UCLouvainAuthority
# Authority configuration.
# Each config correspond to a filter defined in the dilbert API. Possible values:
# - student_ucl = Just students from the UCLouvain
# - academic = Just academic staff from the UCLouvain
# - Other filters can be found in the dilbert API code/config
uclouvain.main_author_query.filter = student_ucl
uclouvain.main_promoter_query.filter = staff_ucl

#------------------------------------------------------------------#
#---------------------- OSIS Configuration ------------------------#
#------------------------------------------------------------------#
uclouvain.esb.base_url = https://gw.api.uclouvain.be
uclouvain.esb.oauth_url = https://is.api.uclouvain.be/realms/WSO2-keymanager/protocol/openid-connect/token
uclouvain.esb.consumer.key = ${ESB_CONSUMER_KEY}
uclouvain.esb.consumer.secret = ${ESB_CONSUMER_SECRET}
# uclouvain.esb.secret = ${ESB_SECRET}

#------------------------------------------------------------------#
#----------------- Bitstream direct download ----------------------#
#------------------------------------------------------------------#
uclouvain.crypto.password = ${BITSTREAM_SECRET}
uclouvain.crypto.salt = qGfUBgjQxpoI0vMwdUZP
#------------------------------------------------------------------#
#------------------------ PDF generation --------------------------#
#------------------------------------------------------------------#
uclouvain.pdf_attestation.date_format = dd/MM/yyyy
uclouvain.pdf_attestation.template_dir = /config/pdf/attestation/

#------------------------------------------------------------------#
#------------------Metadata Field Configuration--------------------#
#------------------------------------------------------------------#
uclouvain.global.metadata.license.field = dc.rights.license
uclouvain.global.metadata.license.default = https://creativecommons.org/licenses/by/4.0/
uclouvain.global.metadata.accesstype.field = dcterms.accessRights
uclouvain.global.metadata.degreecode.field = masterthesis.degree.code
uclouvain.global.metadata.rootdegreecode.field = masterthesis.rootdegree.code
uclouvain.global.metadata.rootdegreelabel.field = masterthesis.rootdegree.label
uclouvain.global.metadata.facultycode.field = masterthesis.faculty.code
uclouvain.global.metadata.facultyname.field = masterthesis.faculty.name
uclouvain.global.metadata.persistentauthoremail.field = authors.email
uclouvain.global.metadata.authoremail.field = authors.email.official
uclouvain.global.metadata.authorinstitution.field = authors.institution.name
uclouvain.global.metadata.id_fgs.field = authors.identifier.fgs
uclouvain.global.metadata.id_noma.field = authors.identifier.noma
uclouvain.global.metadata.authorname.field = dc.contributor.author
uclouvain.global.metadata.advisoremail.field = advisors.email
uclouvain.global.metadata.advisorname.field = dc.contributor.advisor
uclouvain.global.metadata.entitytype.field = dspace.entity.type
uclouvain.global.metadata.session.field = masterthesis.session
uclouvain.global.metadata.year.field = dc.date.issued
uclouvain.global.metadata.activerequestchange.field = masterthesis.changerequest.active

#------------------------------------------------------------------#
#-------------- Packager ingestion configuration ------------------#
#------------------------------------------------------------------#
mets.dspaceSIP.ingest.preserveManifest=true
mets.dspaceSIP.ingest.manifestBitstreamFormat=XML
# Configure XSLT-driven submission crosswalk for MODS-THEIS
crosswalk.submission.MODS-THESIS.stylesheet= crosswalks/mods-thesis-submission.xsl
# Bitstream metadata extractor stylesheet
uclouvain.ingester.bitstreamMetadataExtractor.stylesheet = crosswalks/bitstream-metadata.xsl

#------------------------------------------------------------------#
#------------------- SOLR plugin configuration --------------------#
#------------------------------------------------------------------#
uclouvain.solr.plugin.workflow.degree.field.filter = rootdegreecode_keyword
uclouvain.solr.plugin.workflow.degree.field.metadata = crisrp.workgroup

#------------------------------------------------------------------#
#----------- Resource policy endpoint configuration ---------------#
#------------------------------------------------------------------#
uclouvain.resource_policy.accepted_bundles = ORIGINAL
# Could add more bundle by adding more occurrence of this key:
# ex: uclouvain.resource_policy.accepted_bundles = METADATA

#------------------------------------------------------------------#
#------------------ Submission configuration ----------------------#
#------------------------------------------------------------------#
# This key needs to be set to false here to avoid errors in the frontend when fetching it.
# If not defined here, the config key will be considered has not found and it will throw a 404 HTTP error.
duplicate.enable = false
# Same here
contentreport.enabled = false

# Indicate which are the roles that are allowed to submit an unlimited amount of time
uclouvain.feature.can_create_submission.permit_all_time = Administrator
uclouvain.feature.can_create_submission.permit_all_time = manager
uclouvain.feature.can_create_submission.permit_all_time = unresticted_submit_student

#------------------------------------------------------------------#
#-------------- UCLouvain consumers configuration -----------------#
#------------------------------------------------------------------#
event.consumer.licensegenerator.class = org.dspace.uclouvain.consumer.LicenseConsumer
event.consumer.licensegenerator.filters = Bitstream+Create|Modify_Metadata|Modify

event.consumer.accesstype.class = org.dspace.uclouvain.consumer.AccessTypeConsumer
event.consumer.accesstype.filters = Bitstream+All

event.consumer.authoritymetadataenhancer.class = org.dspace.uclouvain.itemEnhancer.consumer.UCLouvainItemEnhancerConsumer
event.consumer.authoritymetadataenhancer.filters = Item+All

event.consumer.degree.class = org.dspace.uclouvain.consumer.DegreeMetadataConsumer
event.consumer.degree.filters = Item+Modify_Metadata
event.consumer.degree.rule.disable = dcterms.provenance::cataretro
event.consumer.degree.rule.disable = tag.certified

event.consumer.cataretroFaculty.class = org.dspace.uclouvain.consumer.CataretroFacultyMetadataConsumer
event.consumer.cataretroFaculty.filters = Item+Modify_Metadata
event.consumer.cataretroFaculty.rule.enable = dcterms.provenance::cataretro
event.consumer.cataretroFaculty.rule.disable = tag.certified

event.consumer.commentDeletedBitstream.class = org.dspace.uclouvain.consumer.CreateCommentForDeletedBitstreamConsumer
event.consumer.commentDeletedBitstream.filters = Bitstream+Delete|Remove

#------------------------------------------------------------------#
#------------- Community/Collection configuration -----------------#
#------------------------------------------------------------------#
core.authorization.community-admin.collection.template-item = true
core.authorization.collection-mapping.solr.limit = 10000

#------------------------------------------------------------------#
#--------------- Role restriction configuration -------------------#
#------------------------------------------------------------------#
uclouvain.feature.roles.manager = manager
uclouvain.feature.roles.manager = reviewer

uclouvain.feature.roles.librarian = librarian

#------------------------------------------------------------#
#----------------- Metadata Enhancer Poller -----------------#
#------------------------------------------------------------#
# Define the delay in ms between each executions of the poller.
uclouvain-item-enhancer-poller.delay = 30000
# Enable the metadata enhancer poller.
uclouvain-item-enhancer-poller.enabled = false
# Define the limit of entry to pull from the database.
uclouvain-item-enhancer-poller.limit = 500

#------------------------------------------------------------#
#----------------Full-text ingest config---------------------#
#------------------------------------------------------------#
textextractor.max-chars = 50000
discovery.solr.fulltext.charLimit = 50000


#------------------------------------------------------------#
#----------------Local timezone configuration----------------#
#------------------------------------------------------------#
uclouvain.local.timezone = Europe/Brussels

#------------------------------------------------------------------#
#------------------- Emailing configuration -----------------------#
#------------------------------------------------------------------#
uclouvain.pdf_attestation.mail.subject = "[DIAL.mem] Attestation de dépôt / Submitting thesis attestation"
uclouvain.pdf_attestation.mail.error.subject = "[DIAL.mem] Erreur de génération de l'attestation / Submission attestation generation error"
#uclouvain.pdf_attestation.mail.recipients = "bibsys@uclouvain.be"

uclouvain.pdf_attestation.mail.metadata = dc.title
uclouvain.pdf_attestation.mail.metadata = dc.contributor.author
uclouvain.pdf_attestation.mail.metadata = dc.contributor.advisor
uclouvain.pdf_attestation.mail.metadata = dc.description.abstract

uclouvain.pdf_attestation.mail.suffixes = @student.uclouvain.be
uclouvain.pdf_attestation.mail.suffixes = @uclouvain.be
uclouvain.pdf_attestation.mail.suffixes = @isfsc.be

uclouvain.change_request.mail.changerequest.show = true

uclouvain.change_request.mail.subject = "Change requested for your submission"
uclouvain.change_request.mail.recipients = "bibsys@uclouvain.be"

uclouvain.change_request.mail.subject = "[DIAL.mem] Dépôt refusé / submission rejected"
#uclouvain.change_request.mail.recipients = "bibsys@uclouvain.be"

# Health Indicators (`mail` component of /server/actuator/health) ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
#   It probes the SMTP server used for outgoing emails (connection, authentication,
#   envelope sender acceptance) without sending any message.
#   When `mail.server.disabled = true` it reports UNKNOWN and performs no probe at all.
#   The indicator can be turned off completely with `management.health.mail.enabled = false`.
#   Duration during which the last probe result is reused, in seconds.
uclouvain.health.mail.cache-ttl = 60
# Socket/connection timeouts applied to the probe, in milliseconds.
uclouvain.health.mail.timeout = 10000