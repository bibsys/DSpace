uclouvain.dissertation_notify_deposit.mail.metadata = dc.date.issued
uclouvain.dissertation_notify_deposit.mail.metadata = dc.contributor.author
uclouvain.dissertation_notify_deposit.mail.metadata = dc.contributor.advisor
uclouvain.dissertation_notify_deposit.mail.metadata = dc.description.abstract

