uclouvain.dissertation_notify_archive.mail.metadata = dc.date.issued
uclouvain.dissertation_notify_archive.mail.metadata = dc.contributor.author
uclouvain.dissertation_notify_archive.mail.metadata = dc.contributor.advisor
uclouvain.dissertation_notify_archive.mail.metadata = dc.description.abstract